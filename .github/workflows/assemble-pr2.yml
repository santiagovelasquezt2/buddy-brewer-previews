name: Assemble PR2 preview
on:
  push:
    branches: [gh-pages]
    paths:
      - "pr-2-parts/**"
      - ".github/workflows/assemble-pr2.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Assemble PR2 files
        run: |
          python3 << 'PY'
          from pathlib import Path
          import base64, re
          root = Path("pr-2-parts")
          dest_root = Path("pr-2")
          dest_root.mkdir(exist_ok=True)
          groups = {}
          for path in sorted(root.rglob("*.b64")):
              name = path.name
              key = re.sub(r"\.part\d+\.b64$", "", name) if ".part" in name else name[:-4]
              groups.setdefault(key, []).append(path)
          mapping = {
              "index.html": "index.html",
              "styles.css": "styles.css",
              "script.js": "script.js",
              "assets__buddy-brewer-mark.svg": "assets/buddy-brewer-mark.svg",
              "assets__buddy-brewer-logo-stacked.svg": "assets/buddy-brewer-logo-stacked.svg",
              "assets__buddy-brewer-logo-horizontal.svg": "assets/buddy-brewer-logo-horizontal.svg",
          }
          for key, files in groups.items():
              nums = [int(m.group(1)) for p in files if (m := re.search(r"\.part(\d+)\.b64$", p.name))]
              if nums and (min(nums) != 1 or set(nums) != set(range(1, max(nums)+1))):
                  print(f"skip incomplete {key}: {sorted(nums)}")
                  continue
              rel = mapping.get(key, key.replace("__", "/"))
              dest = dest_root / rel
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_bytes(b"".join(base64.b64decode(p.read_text().strip()) for p in files))
              print(f"wrote {dest} ({dest.stat().st_size} bytes)")
          PY
      - name: Commit assembled preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pr-2
          if git diff --cached --quiet; then echo "No assembled changes"; exit 0; fi
          git commit -m "Publish Buddy Brewer PR #2 preview under pr-2/"
          for i in 1 2 3 4 5; do git pull --rebase origin gh-pages && git push && exit 0; sleep 3; done
          git push
